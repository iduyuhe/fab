<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTD 履约流 · 进度墙</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b2e; --panel2:#18213a; --line:#25304f;
    --txt:#e6edf6; --muted:#8a97b5; --accent:#7fd1ff;
    --ok:#3ecf8e; --warn:#f4b740; --bad:#ff6b6b; --blue:#5aa9ff; --purple:#b18cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,'Segoe UI','Microsoft YaHei',sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
  .pill b{color:var(--txt)}
  .refresh{margin-left:auto;font-size:12px;color:var(--muted)}
  .err{display:none;background:#3a1620;border:1px solid #6b2233;color:#ffb3c0;padding:8px 12px;border-radius:8px;margin-bottom:12px}

  /* 七段流水线 */
  .flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0 14px}
  .stage{flex:1 0 150px;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;position:relative;display:flex;flex-direction:column}
  .stage .lab{font-size:13px;color:var(--muted)}
  .stage .val{font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 2px}
  .stage .unit{font-size:12px;color:var(--muted);margin-bottom:8px}
  .stage .backlog{margin-top:auto;font-size:12px;color:var(--muted)}
  .stage .backlog b{color:var(--txt)}
  .arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
  .stage.bottleneck{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
  .stage.busy{border-color:var(--warn)}
  .tag{position:absolute;top:-9px;left:10px;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:700}
  .tag.bad{background:var(--bad);color:#1a0b0e}
  .tag.warn{background:var(--warn);color:#241a05}
  .tag.ok{background:var(--ok);color:#04231a}

  /* 卡点提示条 */
  .bottleneck-note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}
  .bottleneck-note b{color:var(--bad)}

  /* 明细表 */
  .grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h2{font-size:15px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .st.OPEN{background:#2a3350;color:#9db4ff}
  .st.IN_TRANSIT{background:#3a2f12;color:#f4b740}
  .st.DELIVERED{background:#1e3a2a;color:#7fe0b0}
  .st.CLOSED{background:#16331f;color:#3ecf8e}
  .age{color:var(--muted)}
  .side .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .side .row b{font-size:15px}
  .side .kpi-ok{color:var(--ok)} .side .kpi-warn{color:var(--warn)} .side .kpi-bad{color:var(--bad)}

  /* 下钻弹层 */
  .stage{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
  .stage:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .stage .dz{margin-top:6px;font-size:11px;color:var(--accent);opacity:0;transition:opacity .12s}
  .stage:hover .dz{opacity:.92}
  .drill-mask{position:fixed;inset:0;background:rgba(5,8,15,.66);display:none;align-items:flex-start;justify-content:center;padding:42px 16px;z-index:60;backdrop-filter:blur(2px)}
  .drill-mask.show{display:flex}
  .drill{width:min(980px,100%);max-height:84vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .drill header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .drill header h3{margin:0;font-size:16px}
  .drill header .cnt{font-size:12px;color:var(--muted)}
  .drill header .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:none;padding:0 4px}
  .drill header .x:hover{color:var(--txt)}
  .drill .body{overflow:auto;padding:4px 16px 16px}
  .drill .hint{color:var(--muted);font-size:12px;padding:8px 0 4px}
  .drill table{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OTD 履约流 · 进度墙</h1>
  <div class="sub">从「接单」到「回款」一条数字主线，一屏看全每单走到哪、卡在哪。数据每 5 秒自动刷新。</div>

  <div class="bar">
    <span class="pill">累计接单 <b id="k-so">–</b></span>
    <span class="pill">在制批次 <b id="k-wip">–</b></span>
    <span class="pill">量测判异 <b id="k-spc">–</b></span>
    <span class="pill">已回款 <b id="k-closed">–</b></span>
    <span class="pill">应收未收 <b id="k-ar">–</b></span>
    <span class="refresh" id="updated">加载中…</span>
  </div>

  <div class="err" id="err"></div>

  <div class="bottleneck-note" id="bottleneck-note">正在分析卡点…</div>

  <div class="flow" id="flow"></div>

  <div class="grid">
    <div class="card">
      <h2>订单明细（最近 30 单）</h2>
      <table>
        <thead><tr><th>单号</th><th>客户</th><th>产品</th><th class="num">数量</th><th>状态</th><th>龄期</th><th>应交付</th></tr></thead>
        <tbody id="so-body"><tr><td colspan="7" style="color:var(--muted)">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="card side">
      <h2>生产侧支撑</h2>
      <div class="row"><span>已投产批次 (WO)</span><b id="s-release">–</b></div>
      <div class="row"><span>在制批次 (WIP)</span><b id="s-wip" class="kpi-warn">–</b></div>
      <div class="row"><span>已完成批次</span><b id="s-done" class="kpi-ok">–</b></div>
      <div class="row"><span>SPC 判异待处置</span><b id="s-spc" class="kpi-bad">–</b></div>
      <div class="row"><span>在线设备</span><b id="s-tools">–</b></div>
      <div class="row"><span>在途发运 (IN_TRANSIT)</span><b id="s-ship" class="kpi-warn">–</b></div>
      <div class="row"><span>已签收待回款 (DELIVERED)</span><b id="s-deliver" class="kpi-warn">–</b></div>
    </div>
  </div>
</div>

<div class="drill-mask" id="drill">
  <div class="drill">
    <header><h3 id="drill-title">—</h3><span class="cnt" id="drill-cnt"></span><button class="x" id="drill-x" title="关闭">×</button></header>
    <div class="body"><div class="hint" id="drill-hint"></div>
      <table><thead id="drill-thead"></thead><tbody id="drill-body"></tbody></table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtH = ms => { const h = ms/36e5; return h < 1 ? Math.round(ms/6e4)+' 分' : (h<48? h.toFixed(1)+' 时' : (h/24).toFixed(1)+' 天'); };
const money = n => '¥'+(n/1e4).toFixed(1)+'万';

async function getJSON(url){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 4500);
  try { const r = await fetch(url, {signal:c.signal}); return await r.json(); }
  finally { clearTimeout(t); }
}

let last = null;
async function refresh(){
  try{
    const [so, wip, dash, ar, lots, wos, spc] = await Promise.all([
      getJSON('/api/erp/so'), getJSON('/api/wip'), getJSON('/api/dashboard'), getJSON('/api/erp/ar'),
      getJSON('/api/lots'), getJSON('/api/wos'), getJSON('/api/spc/alarms')
    ]);
    last = { so, wip, dash, ar, lots, wos, spc };
    render(last);
    $('err').style.display='none';
    $('updated').textContent = '更新于 '+new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    $('err').style.display='block';
    $('err').textContent = '数据获取失败：'+e.message+'（可能门户代理暂不可用，稍后自动重试）';
  }
}

function render(d){
  const sos = d.so.sos||[];
  const dist = {}; sos.forEach(s=>dist[s.status]=(dist[s.status]||0)+1);
  const open = dist.OPEN||0, ship = dist.IN_TRANSIT||0, deliver = dist.DELIVERED||0, closed = dist.CLOSED||0;
  const spc = (d.dash.spc && d.dash.spc.alarms) || 0;
  const arInv = (d.ar.invoices)||[];
  const arUnpaid = arInv.filter(x=>x.status!=='PAID').length;
  const arTotal = arInv.reduce((a,x)=>a+(x.total||0),0);

  // 顶部 pill
  $('k-so').textContent = d.so.count;
  $('k-wip').textContent = d.wip.wip;
  $('k-spc').textContent = spc;
  $('k-closed').textContent = closed;
  $('k-ar').textContent = arUnpaid;

  // 侧栏
  $('s-release').textContent = d.wip.releases;
  $('s-wip').textContent = d.wip.wip;
  $('s-done').textContent = d.wip.done;
  $('s-spc').textContent = spc;
  $('s-tools').textContent = (d.dash.health && d.dash.health.tools)||'–';
  $('s-ship').textContent = ship;
  $('s-deliver').textContent = deliver;

  // 七段流水线：每段的「数值」与「待处理积压」
  const stages = [
    {key:'so',  lab:'接单', unit:'单',  val:d.so.count, bl:open,    blLab:'已接未发'},
    {key:'rel', lab:'投料', unit:'批',  val:d.wip.releases, bl:null, blLab:''},
    {key:'wip', lab:'加工', unit:'批',  val:d.wip.wip, bl:d.wip.wip, blLab:'在制'},
    {key:'mea', lab:'量测', unit:'项',  val:spc, bl:spc, blLab:'判异待处置'},
    {key:'shp', lab:'发运', unit:'单',  val:ship, bl:ship, blLab:'在途'},
    {key:'del', lab:'交付', unit:'单',  val:deliver, bl:deliver, blLab:'待回款'},
    {key:'ar',  lab:'应收', unit:'单',  val:closed, bl:arUnpaid, blLab:'未收款'},
  ];

  // 卡点识别：取「待处理积压」最大的一段（投料无积压语义，排除）
  let maxBl = -1, botKey = null, busy = new Set();
  stages.forEach(s=>{ if(s.bl!=null){ if(s.bl>maxBl){maxBl=s.bl;botKey=s.key;} if(s.bl>=8) busy.add(s.key); } });
  // 若最大积压很小，不标卡点
  const bottleneckKey = maxBl>=8 ? botKey : null;

  const arrow = '<div class="arrow">→</div>';
  $('flow').innerHTML = stages.map(s=>{
    let cls='', tag='';
    if(s.key===bottleneckKey){ cls='bottleneck'; tag='<span class="tag bad">卡点</span>'; }
    else if(busy.has(s.key)){ cls='busy'; tag='<span class="tag warn">忙</span>'; }
    const blHtml = s.bl!=null ? `<div class="backlog">${s.blLab} <b>${s.bl}</b></div>` : `<div class="backlog">累计计数</div>`;
    return `<div class="stage ${cls}" data-key="${s.key}">${tag}<div class="lab">${s.lab}</div><div class="val">${s.val}</div><div class="unit">${s.unit}</div>${blHtml}<div class="dz">点击看明细 ›</div></div>`;
  }).join(arrow);

  // 卡点说明
  const note = $('bottleneck-note');
  if(bottleneckKey){
    const s = stages.find(x=>x.key===bottleneckKey);
    note.innerHTML = `⚠️ <b>当前卡点：${s.lab}</b> —— ${s.blLab} <b>${s.bl}</b> 项，是七段主线中积压最多的一环。建议优先处置此处，整条 OTD 履约流才能顺畅推进。`;
  }else{
    note.style.borderLeftColor='var(--ok)';
    note.innerHTML = `✅ 各段积压均处低位，OTD 履约流当前顺畅，无显著卡点。`;
  }

  // 明细表（最近 30 单，按创建倒序）
  const rows = sos.slice(0,30).map(s=>{
    const age = Date.now() - new Date(s.created).getTime();
    const due = s.due ? new Date(s.due).toLocaleDateString('zh-CN') : '–';
    return `<tr>
      <td>${s.id}</td><td>${s.customer}</td><td>${s.product}</td>
      <td class="num">${s.qty}</td>
      <td><span class="st ${s.status}">${s.status}</span></td>
      <td class="age">${fmtH(age)}</td><td>${due}</td></tr>`;
  }).join('');
  $('so-body').innerHTML = rows || '<tr><td colspan="7" style="color:var(--muted)">暂无订单</td></tr>';
}

// ---- 下钻弹层 ----
const INPROC = new Set(['WIP','ACTIVE','HOLD','RUN','QUEUED','PROCESSING']);
function esc(s){ return (s==null?'':String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function openDrill(key){
  if(!last) return;
  const D = last;
  let title='', cols=[], rows=[], hint='';
  const sos = D.so.sos||[];
  const ageOf = t => fmtH(Date.now()-new Date(t).getTime());
  if(key==='so'){
    title='接单 · 销售订单(SO)'; hint='全部销售订单（按创建倒序）'; cols=['单号','客户','产品','数量','状态','龄期','应交付'];
    rows = sos.slice().sort((a,b)=>new Date(b.created)-new Date(a.created)).map(s=>{
      const due=s.due?new Date(s.due).toLocaleDateString('zh-CN'):'–';
      return `<tr><td>${esc(s.id)}</td><td>${esc(s.customer)}</td><td>${esc(s.product)}</td><td class="num">${s.qty}</td><td><span class="st ${s.status}">${s.status}</span></td><td class="age">${ageOf(s.created)}</td><td>${due}</td></tr>`;
    });
  } else if(key==='rel'){
    title='投料 · 工单(WO)'; hint='已投产工单（每单派生批次）'; cols=['工单','产品','数量','来源SO','客户','龄期'];
    rows = (D.wos.wos||[]).map(w=>`<tr><td>${esc(w.id)}</td><td>${esc(w.product)}</td><td class="num">${w.qty}</td><td>${esc(w.soId)||'–'}</td><td>${esc(w.customer)||'–'}</td><td class="age">${ageOf(w.created)}</td></tr>`);
  } else if(key==='wip'){
    title='加工 · 在制批次(WIP)'; hint='当前在制（未完工）批次'; cols=['批次','工单','产品','步进','状态','龄期'];
    rows = (D.lots.lots||[]).filter(l=>INPROC.has(l.status)).map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.wo)}</td><td>${esc(l.product)}</td><td class="num">${l.step}/${l.rem+l.step}</td><td><span class="st ${l.status}">${l.status}</span></td><td class="age">${ageOf(l.created)}</td></tr>`);
  } else if(key==='mea'){
    title='量测 · SPC 判异'; hint='近 30 条 SPC 判异（自动触发处置流）'; cols=['#','时间','产品','参数','机台','实测','规格 UCL/LCL','规则'];
    rows = (D.spc.alarms||[]).map(a=>`<tr><td class="num">${a.id}</td><td class="age">${new Date(a.ts).toLocaleTimeString('zh-CN')}</td><td>${esc(a.product)||'–'}</td><td>${esc(a.param)}</td><td>${esc(a.tool)}</td><td class="num">${a.value}</td><td class="num">${a.ucl}/${a.lcl}</td><td>${esc((a.rules||[]).join('；'))}</td></tr>`);
  } else if(key==='shp'){
    title='发运 · 在途(IN_TRANSIT)'; hint='已发货、在途未签收订单'; cols=['单号','客户','产品','数量','状态','龄期'];
    rows = sos.filter(s=>s.status==='IN_TRANSIT').map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.customer)}</td><td>${esc(s.product)}</td><td class="num">${s.qty}</td><td><span class="st ${s.status}">${s.status}</span></td><td class="age">${ageOf(s.created)}</td></tr>`);
  } else if(key==='del'){
    title='交付 · 待回款(DELIVERED)'; hint='已签收、待回款订单'; cols=['单号','客户','产品','数量','状态','龄期'];
    rows = sos.filter(s=>s.status==='DELIVERED').map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.customer)}</td><td>${esc(s.product)}</td><td class="num">${s.qty}</td><td><span class="st ${s.status}">${s.status}</span></td><td class="age">${ageOf(s.created)}</td></tr>`);
  } else if(key==='ar'){
    title='应收 · 已回款(CLOSED)'; hint='已完成回款并关单'; cols=['单号','客户','产品','数量','状态','龄期'];
    rows = sos.filter(s=>s.status==='CLOSED').map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.customer)}</td><td>${esc(s.product)}</td><td class="num">${s.qty}</td><td><span class="st ${s.status}">${s.status}</span></td><td class="age">${ageOf(s.created)}</td></tr>`);
  }
  $('drill-title').textContent = title;
  $('drill-cnt').textContent = rows.length + ' 条';
  $('drill-hint').textContent = hint;
  $('drill-thead').innerHTML = '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  $('drill-body').innerHTML = rows.join('') || `<tr><td colspan="${cols.length}" style="color:var(--muted)">该阶段当前无在制记录</td></tr>`;
  $('drill').classList.add('show');
}
function closeDrill(){ $('drill').classList.remove('show'); }

$('flow').addEventListener('click', e=>{ const st=e.target.closest('.stage'); if(st&&st.dataset.key) openDrill(st.dataset.key); });
$('drill-x').addEventListener('click', closeDrill);
$('drill').addEventListener('click', e=>{ if(e.target.id==='drill') closeDrill(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrill(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
