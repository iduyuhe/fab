<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶圆厂智能制造平台 · EAP 协议控制台</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --panel2:#0f1626; --line:#1f2b45;
    --text:#cfd8e3; --muted:#6b7a94; --accent:#4ea1ff; --green:#39d98a;
    --tx:#4ea1ff; --rx:#b98cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  h1{font-size:18px;letter-spacing:.5px}
  .badge{font-size:11px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .badge.ok{border-color:var(--green);color:var(--green)}
  .spacer{flex:1}
  .btn{background:linear-gradient(90deg,#1a4f8b,#2f81f7);border:none;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px}
  .btn.g{background:linear-gradient(90deg,#17704c,#2ea06a)} .btn.y{background:linear-gradient(90deg,#8a6517,#c99a2e)} .btn.r{background:linear-gradient(90deg,#8a1f2e,#c2334a)}
  .grid{display:grid;gap:12px;margin-bottom:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .cards{grid-template-columns:1fr 1.2fr}
  @media(max-width:900px){.cards{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h2{font-size:13px;color:var(--accent);margin-bottom:10px;font-weight:600;letter-spacing:.5px}
  .kpi .v{font-size:24px;font-weight:700;font-family:Consolas,monospace}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .dev{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .dev .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dev .name{font-weight:600;font-family:Consolas,monospace}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .on{background:var(--green);box-shadow:0 0 8px var(--green)} .off{background:#5a5f6a}
  .dev .row{font-size:11px;color:var(--muted);margin:3px 0}
  .dev .row b{color:var(--text);font-family:Consolas,monospace}
  .dev .ops{margin-top:8px;display:flex;gap:6px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  td{padding:4px 8px;border-bottom:1px solid var(--panel2);font-family:Consolas,monospace;font-size:11px}
  .tx{color:var(--tx)} .rx{color:var(--rx)}
  .muted{color:var(--muted)}
  /* 面板显隐开关 */
  #hud-toggle{position:fixed;top:60px;right:14px;z-index:99;
    font:12px/1.4 system-ui,'Segoe UI',sans-serif;color:var(--muted);white-space:nowrap;
    background:rgba(78,161,255,0.18);border:1px solid rgba(78,161,255,0.4);
    border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .15s;}
  #hud-toggle:hover{background:rgba(78,161,255,0.35);color:var(--text);}
  body.hud-hidden header,body.hud-hidden #kpis{display:none !important;}
  .scroll{max-height:340px;overflow:auto}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
</style>
</head>
<body>
<!-- UNIFIED NAV --><nav class="unav"><span class="unav-brand">晶圆厂智能制造平台</span><a href="/portal.html">门户总览</a><a href="/console.html">MES 控制台</a><a href="/eap-console.html">EAP 控制台</a><a href="/erp-ops.html">ERP 操作台</a><a href="/wms-ops.html">WMS 仓储</a><a href="/config-admin.html">主数据配置</a><a href="/npi-ops.html">NPI 流片</a><a href="/twin3d/">3D 物理工厂</a><a href="/twin3d/portal.html">角色工作台</a><a href="/twin.html">2D 装备孪生</a><a href="/line-twin.html">2D 产线孪生</a><a href="/fab-twin.html">2D 工厂孪生</a><a href="/sim.html">产能仿真</a><a href="/lab.html">教学实验台</a><a href="/agent.html">问答副驾</a></nav><style>.unav{position:sticky;top:0;z-index:999;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 14px;background:#0e1530;border-bottom:1px solid #25304f;font:13px/1.4 system-ui,'Segoe UI',sans-serif}.unav-brand{font-weight:700;color:#7fd1ff;margin-right:4px}.unav a{color:#cdd6f0;text-decoration:none;padding:3px 8px;border-radius:6px}.unav a:hover{background:#1a2444;color:#fff}</style>

<header>
  <h1>🔌 eap-host · EAP 协议链路控制台</h1>
  <span class="badge" id="b-svc">连接中…</span>
  <span class="badge" id="b-gw">–</span>
  <span class="spacer"></span>
  <span class="muted" style="font-size:11px">轮询</span><span class="badge" id="b-poll">–</span>
  <button class="btn" id="btn-refresh">刷新</button>
</header>
<button id="hud-toggle" title="隐藏/显示顶部面板 (H)">🙈 隐藏面板</button>

<div class="grid kpis" id="kpis"></div>

<div class="grid cards">
  <div class="panel">
    <h2>设备会话（HSMS）</h2>
    <div id="devices"></div>
  </div>
  <div class="panel">
    <h2>SECS/GEM 协议交互流</h2>
    <div class="scroll"><table id="traffic">
      <tr><th>时间</th><th>设备</th><th>方向</th><th>消息</th><th>内容</th></tr>
    </table></div>
  </div>
</div>

<div class="panel">
  <h2>S6F11 事件流（翻译为标准事件 → MES ingest）</h2>
  <div class="scroll"><table id="events">
    <tr><th>时间</th><th>设备</th><th>状态</th><th>CEID</th></tr>
  </table></div>
</div>

<script>
const $ = id => document.getElementById(id);
const tt = ts => new Date(ts).toTimeString().slice(0, 8);

// EAP 控制台：所有 /api/* 经门户统一网关(/api/eap/)转发到 EAP(8125)，解决原先相对路径被错代理到 MES 的 404
async function api(p, opts){ const url = p.startsWith('/api/') ? p.replace('/api/', '/api/eap/') : p; const r = await fetch(url, opts); return r.json(); }

async function refresh(){
  try{
    const [h, d, t, e] = await Promise.all([
      api('/api/health'), api('/api/devices'), api('/api/traffic'), api('/api/events'),
    ]);
    $('b-svc').textContent = h.service + ' v' + h.version;
    $('b-svc').className = 'badge ok';
    $('b-gw').textContent = '网关 ' + h.host;
    $('b-poll').textContent = h.pollMs + 'ms';

    $('kpis').innerHTML = `
      <div class="panel kpi"><div class="v" style="color:var(--green)">${h.online}/${h.total}</div><div class="l">在线设备会话</div></div>
      <div class="panel kpi"><div class="v">${e.count}</div><div class="l">S6F11 事件（翻译）</div></div>
      <div class="panel kpi"><div class="v">${t.count}</div><div class="l">协议交互记录</div></div>
      <div class="panel kpi"><div class="v">${h.uptime}s</div><div class="l">运行时长</div></div>`;

    // 设备会话卡
    $('devices').innerHTML = d.devices.map(x => `
      <div class="dev">
        <div class="top"><span class="dot ${x.online ? 'on' : 'off'}"></span>
          <span class="name">${x.name}</span>
          <span class="tag" style="color:${x.online ? 'var(--green)' : 'var(--muted)'}">${x.online ? 'ONLINE' : 'OFFLINE'}</span>
          <span class="spacer"></span><span class="muted">deviceId ${x.deviceId}</span></div>
        <div class="row">最后 S1F1 轮询：<b>${x.lastS1F1 ? tt(x.lastS1F1) : '—'}</b></div>
        <div class="row">最近事件：<b>${x.lastEvent ? x.lastEvent.status + ' (CEID ' + x.lastEvent.ceid + ')' : '—'}</b></div>
        <div class="ops">
          <button class="btn g" data-c="START" data-d="${x.deviceId}">START</button>
          <button class="btn r" data-c="ABORT" data-d="${x.deviceId}">ABORT</button>
          <button class="btn y" data-c="STOP" data-d="${x.deviceId}">STOP</button>
        </div>
      </div>`).join('');

    // 协议交互流
    $('traffic').innerHTML = '<tr><th>时间</th><th>设备</th><th>方向</th><th>消息</th><th>内容</th></tr>' +
      t.traffic.map(x => `<tr>
        <td class="muted">${tt(x.t)}</td><td>${x.device}</td>
        <td class="${x.dir === 'TX' ? 'tx' : 'rx'}">${x.dir === 'TX' ? '↑ TX' : '↓ RX'}</td>
        <td><b>${x.label}</b></td><td class="muted">${x.detail || ''}</td></tr>`).join('') ||
      '<tr><td colspan="5" class="muted">暂无交互</td></tr>';

    // 事件流
    $('events').innerHTML = '<tr><th>时间</th><th>设备</th><th>状态</th><th>CEID</th></tr>' +
      e.events.map(x => `<tr>
        <td class="muted">${tt(x.t)}</td><td>${x.device}</td>
        <td><b style="color:${x.status === 'RUN' ? 'var(--green)' : x.status === 'DOWN' ? '#ff5c5c' : 'var(--text)'}">${x.status}</b></td>
        <td class="muted">${x.ceid}</td></tr>`).join('') ||
      '<tr><td colspan="4" class="muted">暂无事件</td></tr>';
  }catch(err){
    $('b-svc').textContent = 'EAP 未连接: ' + err.message;
    $('b-svc').className = 'badge';
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-c]');
  if(b){
    b.disabled = true;
    const r = await api(`/api/devices/${b.dataset.d}/control`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rcmd: b.dataset.c }) });
    b.disabled = false;
    refresh();
  }
});
$('btn-refresh').onclick = refresh;
setInterval(refresh, 3000);
refresh();
// 面板显隐开关
(function(){ const b=document.getElementById('hud-toggle'); if(!b) return;
  function t(){ const h=document.body.classList.toggle('hud-hidden'); b.textContent=h?'👁 显示面板':'🙈 隐藏面板'; }
  b.addEventListener('click',t); window.addEventListener('keydown',e=>{ if((e.key==='h'||e.key==='H')&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) t(); }); })();
</script>
</body>
</html>
