# fab-mes 资源上限护栏（systemd drop-in）
# 安装（需在服务器上执行，本文件仅随仓库提供，未自动应用）：
#   mkdir -p /etc/systemd/system/fab-mes.service.d
#   cp deploy/fab-mes.resource.conf /etc/systemd/system/fab-mes.service.d/resource.conf
#   systemctl daemon-reload
#   systemctl restart fab-mes
# 说明：即使程序层护栏未生效，也保证 fab 拖不死整机（来自《CPU 优化需求说明书》§七）。

[Service]
# 最多用 2 核（4 核机器的 50%），避免独占 CPU 拖垮同机的 LDA / A-GEO / 工作台
CPUQuota=200%
# 内存硬上限：留足空间给 LDA/A-GEO（整机 3.7GB），防止内存耗尽触发 OOM 误杀数据库等关键服务
MemoryMax=1800M
# 进程/线程数上限，防止失控 fork / 定时器泄漏拖垮系统
TasksMax=512
