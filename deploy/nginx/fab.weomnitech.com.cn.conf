# fab-mes 晶圆厂AI原生的智能制造平台 — 反向代理入口
# 域名模式沿用服务器既有 *.weomnitech.com.cn 子域 + Let's Encrypt 证书。
#
# ① 正式入口（:80，子域）：添加 A 记录 fab.weomnitech.com.cn -> 115.191.20.92 后，
#    运行 `certbot --nginx -d fab.weomnitech.com.cn` 即可自动升级为 HTTPS（certbot 会改写本块）。
# ② 临时入口（:8888，公网 IP 直访）：DNS A 记录就绪前用 http://115.191.20.92:8888/
#    （:8080 已被系统 verification_server 占用，故改用 8888；若被云安全组拦截，开放该端口即可，
#     或直接用①的子域方式。）
# 后台服务基址：portal :8203（统一托管静态页 + /api 反代到各业务进程 + WebSocket）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# —— ① 子域正式入口 ——
server {
    server_name fab.weomnitech.com.cn;

    # ACME challenge，供后续 certbot 签发证书使用
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8203;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（问答副驾 / 事件总线实时推送）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fab.weomnitech.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fab.weomnitech.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# —— ② 公网 IP 直访临时入口 ——
server {
    listen 8888;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8203;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    if ($host = fab.weomnitech.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name fab.weomnitech.com.cn;
    return 404; # managed by Certbot


}