<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶圆厂智能制造平台 · 智能体问答</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --panel2:#0f1626; --line:#1f2b45;
    --txt:#cfd8e3; --muted:#6b7a94; --accent:#4ea1ff;
    --run:#39d98a; --idle:#5b7fb0; --pm:#f2c14e; --down:#ff5c5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:15px;color:var(--accent);letter-spacing:.5px}
  header .tag{color:var(--muted);font-size:12px}
  header .conn{margin-left:auto;font-size:12px;color:var(--muted)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#06101f;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.bot .cards{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .msg.bot .cards .ct{color:var(--accent);font-size:12px;margin-bottom:4px}
  .msg.bot .cards ul{margin:0;padding-left:16px}
  .msg.bot .cards li{color:var(--txt);font-size:12px;cursor:pointer}
  .msg.bot .cards li:hover{color:var(--accent)}
  #quick{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel2)}
  #quick button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer}
  #quick button:hover{border-color:var(--accent);color:var(--accent)}
  #input{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
  #input input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:13px;outline:none}
  #input input:focus{border-color:var(--accent)}
  #input button{background:var(--accent);color:#06101f;border:none;border-radius:8px;padding:0 18px;font-weight:600;cursor:pointer}
  #cfg{position:fixed;bottom:8px;right:12px;font-size:11px;color:var(--muted)}
  #cfg input{width:130px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:2px 6px;font-size:11px}

  .nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line,#1f2b45)}
  .nav a{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--line,#1f2b45);color:var(--muted,#6b7a94);text-decoration:none}
  .nav a:hover{color:var(--accent,#4ea1ff);border-color:var(--accent,#4ea1ff)}
</style>
</head>
<body>
<!-- UNIFIED NAV --><nav class="unav"><span class="unav-brand">晶圆厂智能制造平台</span><a href="/portal.html">门户总览</a><a href="/console.html">MES 控制台</a><a href="/eap-console.html">EAP 控制台</a><a href="/erp-ops.html">ERP 操作台</a><a href="/wms-ops.html">WMS 仓储</a><a href="/config-admin.html">主数据配置</a><a href="/npi-ops.html">NPI 流片</a><a href="/twin3d/">3D 物理工厂</a><a href="/twin3d/portal.html">角色工作台</a><a href="/twin.html">2D 装备孪生</a><a href="/line-twin.html">2D 产线孪生</a><a href="/fab-twin.html">2D 工厂孪生</a><a href="/sim.html">产能仿真</a><a href="/lab.html">教学实验台</a><a href="/agent.html">问答副驾</a></nav><style>.unav{position:sticky;top:0;z-index:999;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 14px;background:#0e1530;border-bottom:1px solid #25304f;font:13px/1.4 system-ui,'Segoe UI',sans-serif}.unav-brand{font-weight:700;color:#7fd1ff;margin-right:4px}.unav a{color:#cdd6f0;text-decoration:none;padding:3px 8px;border-radius:6px}.unav a:hover{background:#1a2444;color:#fff}</style>

<header>
  <h1>数智晶圆厂 · 对话式 Agent</h1>
  <span class="tag">L1 社区级 · 零 API 成本 · 实时检索 MES/ERP</span>
  <span class="conn" id="conn">连接中…</span>
</header>
<div id="chat"></div>
<div id="quick"></div>
<div id="input">
  <input id="box" placeholder="问点什么：查实时 WIP / 设备状态 / ERP 成本 / 五大引擎是什么…" onkeydown="if(event.key==='Enter')send()" />
  <button onclick="send()">发送</button>
</div>
<div id="cfg">Agent 地址: <input id="agentUrl" value="/api/agent/chat"></div>

<script>
const chat = document.getElementById('chat');
const box = document.getElementById('box');
const quick = document.getElementById('quick');
const conn = document.getElementById('conn');
const agentUrl = document.getElementById('agentUrl');

const QUICK = [
  '平台概览', '怎么看数字孪生', '五大引擎是什么', '查实时 WIP',
  '查设备状态', '查 ERP 成本', '怎么做 what-if 仿真', '用 SPC 拦截 CD 漂移',
];

function addMsg(text, who, cards) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  if (cards && cards.length) {
    const c = document.createElement('div'); c.className = 'cards';
    cards.forEach(card => {
      const t = document.createElement('div'); t.className = 'ct'; t.textContent = card.title || '';
      const ul = document.createElement('ul');
      (card.items || []).forEach(it => {
        const li = document.createElement('li'); li.textContent = it;
        li.onclick = () => { box.value = it; send(); };
        ul.appendChild(li);
      });
      c.appendChild(t); c.appendChild(ul);
    });
    d.appendChild(c);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function checkConn() {
  const base = agentUrl.value.replace(/\/api\/agent\/chat$/, '') + '/api/agent/health';
  fetch(base).then(r => r.json()).then(j => {
    conn.textContent = j.ok ? '已连接 :' + j.port : '异常';
    conn.style.color = j.ok ? 'var(--run)' : 'var(--down)';
  }).catch(() => { conn.textContent = '未连接'; conn.style.color = 'var(--down)'; });
}

async function send() {
  const msg = box.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  box.value = '';
  try {
    const r = await fetch(agentUrl.value, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const j = await r.json();
    addMsg(j.reply || '(无回复)', 'bot', j.cards);
  } catch (e) {
    addMsg('连接失败：' + e.message + '\n请确认 agent 进程已在 8127 启动。', 'bot');
  }
}

// 副驾主动推送（不等用户问）：连接 Agent WS，收到 predAlarm 提醒即渲染为副驾消息
let wsRetry = null;
function scheduleWS() { if (!wsRetry) wsRetry = setTimeout(() => { wsRetry = null; connectAgentWS(); }, 3000); }
function connectAgentWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let ws;
  try { ws = new WebSocket(proto + '//' + location.host + '/api/agent/ws'); }
  catch (e) { return scheduleWS(); }
  ws.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      if (m && m.type === 'proactive') addMsg('【副驾主动提醒】\n' + m.text, 'bot', m.data && m.data.cards);
    } catch (_) {}
  };
  ws.onclose = () => scheduleWS();
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
connectAgentWS();

QUICK.forEach(q => { const b = document.createElement('button'); b.textContent = q; b.onclick = () => { box.value = q; send(); }; quick.appendChild(b); });
agentUrl.onchange = checkConn;
checkConn();
addMsg('你好，我是数智晶圆厂平台的对话助手（L1 社区级，零 API 成本）。我可以介绍平台、讲解五大引擎、引导孪生页，并实时查询 MES/ERP 状态。试试下面的快捷问题吧。', 'bot', [{ title: '可问的问题', items: QUICK }]);
</script>
</body>
</html>
